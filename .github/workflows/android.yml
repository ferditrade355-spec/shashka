name: Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip'ni ochish
        run: |
          test -f shashka_android.zip || { echo "shashka_android.zip repoda topilmadi"; exit 1; }
          unzip -q -o shashka_android.zip -d proj
          ls proj proj/android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Dvigatelni ARM64 uchun yasash
        working-directory: proj
        run: |
          NDK="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          echo "NDK: $NDK"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          "$CC" -O3 -w -pie -fPIE -DKING_STOP=2 -o android/app/src/main/jniLibs/arm64-v8a/libengine.so android/engine/engine.c -lm
          ls -la android/app/src/main/jniLibs/arm64-v8a/
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: APK yasash
        working-directory: proj/android
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: shashka-bot-apk
          path: proj/android/app/build/outputs/apk/debug/app-debug.apk
