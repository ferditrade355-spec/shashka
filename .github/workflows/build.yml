name: Build exe
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller mss numpy
      - run: pyinstaller --onefile --noconsole --name ShashkaAI shashka.py
      - uses: actions/upload-artifact@v4
        with:
          name: ShashkaAI
          path: dist/ShashkaAI.exe
