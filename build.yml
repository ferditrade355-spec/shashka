name: Build exe
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Yig'ish (dvigatel + ilova)
        shell: bash
        run: |
          pip install pyinstaller mss numpy
          export PATH="$PATH:/c/mingw64/bin:/c/ProgramData/mingw64/mingw64/bin"
          if ! command -v gcc >/dev/null 2>&1; then
            choco install mingw -y || true
            export PATH="$PATH:/c/ProgramData/mingw64/mingw64/bin"
          fi
          if gcc -O3 -static -o engine.exe engine.c; then
            echo "Dvigatel kompilyatsiya qilindi"
            pyinstaller --onefile --noconsole --name ShashkaAI --add-binary "engine.exe;." shashka.py
          else
            echo "gcc ishlamadi: dvigatelsiz yig'iladi (Python dvigateli ishlatiladi)"
            pyinstaller --onefile --noconsole --name ShashkaAI shashka.py
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ShashkaAI
          path: dist/ShashkaAI.exe
